<!DOCTYPE HTML>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete a Form</title>
	<link rel="stylesheet" href="styles/main.css">
</head>

<body>
<h1>Please complete our survey</h1>
<form action="../confirmation.html" method="post">
	<h3>Contact information</h3>
    <div>
		<label for="email">Email address:</label>
		<input type="text" id="email">
	</div>
	<div>
		<label for="first_name">First name:</label>
		<input type="text" id="first_name" name="first_name" value="">
	</div>
		<label for="last_name">Last name:</label>
		<input type="text" id="last_name" name="last_name" value="">
	<h3>Geographic information</h3>
	<div>
		<label for="state">State:</label>
		<input type="text" id="state" id="state" name="state"
		placeholder="Two characters" maxlength="2">
	</div>
    <div>
		<label for="zip_code">Zip code:</label>
		<input type="text" id="zip_code" id="zip_code" name="zip_code"
		placeholder="Five digits" maxlength="5">
	</div>
	<h3>Source</h3>
	<div>

	</div>
	<div>
		<label for="comments">Additional Comments:</label>
		<textarea id="comments" placeholder="Add any additional comments here."></textarea>
	</div>
	<div>
		<button type="submit">Submit</button>
		<button type="reset">Reset</button>
	</div>
</form>
</body>
</html>
