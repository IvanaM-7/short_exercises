<!DOCTYPE HTML>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete a Form</title>
	<link rel="stylesheet" href="styles/main.css">
</head>

<body>
<h1>Please complete our survey</h1>
<form action="confirmation.html" method="get">
	<fieldset>
		<legend>Contact information</legend>
    <div>
		<label for="email" accesskey="E"><u>E</u>mail address:</label>
		<input type="text" id="email" accesskey="E" required>
	</div>
	<div>
		<label for="first_name" accesskey="F"><u>F</u>irst name:</label>
		<input type="text" id="first_name" name="first_name" accesskey="F" required>
	</div>
		<label for="last_name" accesskey="L"><u>L</u>ast name:</label>
		<input type="text" id="last_name" name="last_name" accesskey="L" required>
	</fieldset>
	<fieldset>
		<legend>Geographic information</legend>
	<div>
		<label for="state" accesskey="S"><u>S</u>tate:</label>
		<input type="text" id="state" id="state" name="state"
		placeholder="Two characters" maxlength="2" accesskey="S" required>
	</div>
    <div>
		<label for="zip_code" accesskey="Z"><u>Z</u>ip code:</label>
		<input type="text" id="zip_code" id="zip_code" name="zip_code"
		placeholder="Five digits" maxlength="5" accesskey="Z" required
		pattern="\d{5}([\-]\d{4})?">
	</div>
	</fieldset>
	<fieldset>
		<legend>Source</legend>
	<div>
	<label for="options">How did you hear about us?</label>
	<select id="options" name="options">
		<option value="web_search">Web Search</option>
	</select>
	</div>
	<div>
		<label for="comments">Additional Comments:</label>
		<textarea id="comments" placeholder="Add any additional comments here."></textarea>
	</div>
	</fieldset>
	<div>
		<button class="submit" type="submit">Submit</button>
		<button class="reset" type="reset">Reset</button>
	</div>
</form>
</body>
</html>
